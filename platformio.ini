; Ясмина — лицо на GC9A01 240x240

[env]
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<panel_test.cpp> -<voice.cpp>   ; тест панели и голос живут в своих средах
build_flags =
    -O2
    -ffast-math
    -Wall

; --- плата, которая подключена сейчас: S3-DevKitC-1 N16R8 ---
[env:s3n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi   ; флеш QIO + октальная PSRAM
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_S3_N16R8
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial идёт в UART0, на мост CH343

; --- плата Сергея: лицо + голос, та, что уже спаяна ---
; Распиновка его (см. include/config.h, BOARD_S3_YASMINA), код наш:
; свой драйвер GC9A01 вместо Adafruit_ST7789 и рисованное лицо вместо текста.
[env:yasmina]
platform = espressif32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi   ; флеш QIO + октальная PSRAM
board_build.partitions = default_16MB.csv
build_src_filter = +<*> -<panel_test.cpp>
build_flags =
    ${env.build_flags}
    -DBOARD_S3_YASMINA
    -DBOARD_HAS_PSRAM
    -DVOICE_ENABLED
    -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial идёт в UART0, на мост CH343
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; --- плата под серийную сборку ---
[env:s3super]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_S3_SUPERMINI
    -DARDUINO_USB_CDC_ON_BOOT=1

; --- то, на чём можно проверить прямо сейчас ---
[env:wroom]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_WROOM

; --- проверка самой панели: заливки и маркеры вместо лица ---
[env:paneltest]
extends = env:s3n16r8
build_src_filter = +<*> -<main.cpp> -<face.cpp> -<shapes.cpp> -<voice.cpp>
build_flags =
    ${env:s3n16r8.build_flags}
    -DPANEL_TEST_SLOW_SPI
